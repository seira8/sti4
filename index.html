<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="キャラチャットのお話づくりに使える、お題ガチャ。">
<title>お話ガチャ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: one capsule-toy machine in the middle; five slot windows stacked (the first opens a row of sub-capsules when locked), lever below, history + word editor underneath */
:root{
  --bg:#0a0a0a; --bg-a:#2b1233; --bg-b:#3d1219; --bg-c:#0f2140; --caps-op:.2; --page-ink:#f3eff6; --page-muted:#a8a2b4;
  --machine:#e0452f; --machine-dark:#b5321f;
  --panel:#fffdf8; --ink:#25313a; --muted:#5f6e78;
  --cap1:#ffcf3f; --cap2:#ff8fb1; --cap3:#5fd0a3; --cap4:#6cb6ff; --cap5:#b892ff;
  --neta:#ff6a3d; --neta-ink:#fff;
  --line:#cdd8de; --sub-bg:#f3f6f8;
  --f-display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --bg-a:#2b1233; --bg-b:#3d1219; --bg-c:#0f2140; --caps-op:.2; --page-ink:#f3eff6; --page-muted:#a8a2b4; --machine:#d2402b; --machine-dark:#8f2717;
  --panel:#24303a; --ink:#eef3f6; --muted:#9fb0bb; --line:#3a4a57; --sub-bg:#1c2730; --neta:#ff7a50; --neta-ink:#1a0d06; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --bg-a:#2b1233; --bg-b:#3d1219; --bg-c:#0f2140; --caps-op:.2; --page-ink:#f3eff6; --page-muted:#a8a2b4; --machine:#d2402b; --machine-dark:#8f2717;
  --panel:#24303a; --ink:#eef3f6; --muted:#9fb0bb; --line:#3a4a57; --sub-bg:#1c2730; --neta:#ff7a50; --neta-ink:#1a0d06; color-scheme:dark}

*{box-sizing:border-box}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 50% at 15% 10%,var(--bg-a),transparent 70%),radial-gradient(55% 45% at 90% 30%,var(--bg-b),transparent 70%),radial-gradient(70% 50% at 50% 100%,var(--bg-c),transparent 70%),var(--bg)}
.bgfx::before{content:"";position:absolute;inset:-260px;opacity:var(--caps-op);background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><g transform='translate(40 46) rotate(-20)'><path d='M-17 0a17 17 0 0 1 34 0z' fill='%23ffcf3f'/><path d='M-17 0a17 17 0 0 0 34 0z' fill='%23ffffff'/><circle r='17' fill='none' stroke='%2325313a' stroke-width='2.5'/><path d='M-17 0h34' stroke='%2325313a' stroke-width='2.5'/><circle cx='-6.8' cy='-7.7' r='3.1' fill='%23ffffff' opacity='.7'/></g><g transform='translate(150 30) rotate(35)'><path d='M-13 0a13 13 0 0 1 26 0z' fill='%23ff8fb1'/><path d='M-13 0a13 13 0 0 0 26 0z' fill='%23ffffff'/><circle r='13' fill='none' stroke='%2325313a' stroke-width='2.5'/><path d='M-13 0h26' stroke='%2325313a' stroke-width='2.5'/><circle cx='-5.2' cy='-5.9' r='2.3' fill='%23ffffff' opacity='.7'/></g><g transform='translate(210 120) rotate(-45)'><path d='M-19 0a19 19 0 0 1 38 0z' fill='%235fd0a3'/><path d='M-19 0a19 19 0 0 0 38 0z' fill='%23ffffff'/><circle r='19' fill='none' stroke='%2325313a' stroke-width='2.5'/><path d='M-19 0h38' stroke='%2325313a' stroke-width='2.5'/><circle cx='-7.6' cy='-8.6' r='3.4' fill='%23ffffff' opacity='.7'/></g><g transform='translate(95 140) rotate(15)'><path d='M-15 0a15 15 0 0 1 30 0z' fill='%236cb6ff'/><path d='M-15 0a15 15 0 0 0 30 0z' fill='%23ffffff'/><circle r='15' fill='none' stroke='%2325313a' stroke-width='2.5'/><path d='M-15 0h30' stroke='%2325313a' stroke-width='2.5'/><circle cx='-6.0' cy='-6.8' r='2.7' fill='%23ffffff' opacity='.7'/></g><g transform='translate(30 215) rotate(60)'><path d='M-13 0a13 13 0 0 1 26 0z' fill='%23b892ff'/><path d='M-13 0a13 13 0 0 0 26 0z' fill='%23ffffff'/><circle r='13' fill='none' stroke='%2325313a' stroke-width='2.5'/><path d='M-13 0h26' stroke='%2325313a' stroke-width='2.5'/><circle cx='-5.2' cy='-5.9' r='2.3' fill='%23ffffff' opacity='.7'/></g><g transform='translate(175 220) rotate(-10)'><path d='M-16 0a16 16 0 0 1 32 0z' fill='%23ffcf3f'/><path d='M-16 0a16 16 0 0 0 32 0z' fill='%23ffffff'/><circle r='16' fill='none' stroke='%2325313a' stroke-width='2.5'/><path d='M-16 0h32' stroke='%2325313a' stroke-width='2.5'/><circle cx='-6.4' cy='-7.2' r='2.9' fill='%23ffffff' opacity='.7'/></g><g transform='translate(250 10) rotate(20)'><path d='M-10 0a10 10 0 0 1 20 0z' fill='%236cb6ff'/><path d='M-10 0a10 10 0 0 0 20 0z' fill='%23ffffff'/><circle r='10' fill='none' stroke='%2325313a' stroke-width='2.5'/><path d='M-10 0h20' stroke='%2325313a' stroke-width='2.5'/><circle cx='-4.0' cy='-4.5' r='1.8' fill='%23ffffff' opacity='.7'/></g></svg>");background-size:260px 260px;
  animation:drift 90s linear infinite}
.bgfx::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,var(--bg) 100%);opacity:.55}
@keyframes drift{to{transform:translate(260px,260px)}}
@media (prefers-reduced-motion:reduce){.bgfx::before{animation:none}}
body{background:var(--bg);
  color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}

header{text-align:center}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,8vw,42px);margin:0;letter-spacing:.04em;color:var(--machine);text-wrap:balance}
header p{margin:2px 0 0;color:var(--page-muted);font-size:14px}

.machine{background:var(--machine);border-radius:28px 28px 18px 18px;padding:20px 18px 22px;
  box-shadow:0 8px 0 var(--machine-dark),0 18px 50px rgba(224,69,47,.25);display:grid;gap:14px}
.dome{background:var(--panel);border-radius:18px;padding:18px 16px;display:grid;gap:10px;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.slot{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.ball{width:34px;height:34px;border-radius:50%;flex:none;position:relative;overflow:hidden;
  background:linear-gradient(var(--c) 50%,var(--panel) 50%);box-shadow:inset 0 0 0 2.5px var(--ink)}
.ball::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1.25px);height:2.5px;background:var(--ink)}
.slot .box{min-width:0;border-bottom:2.5px dashed var(--line);padding:2px 2px 4px}
.slot small{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted);line-height:1.2}
.slot .val{font-weight:700;font-size:clamp(16px,4.6vw,19px);line-height:1.4;word-break:break-word}
.slot .val .p{color:var(--muted);font-weight:500;font-size:.85em;margin-left:2px}
.slot .val .s{font-size:.8em;color:var(--muted);margin-left:2px}
.tag{display:inline-block;vertical-align:2px;margin-left:6px;font-size:10px;line-height:1;padding:3px 5px;border-radius:5px;
  background:var(--neta);color:var(--neta-ink);font-weight:700;letter-spacing:.06em}
.slot.spin .val{filter:blur(.6px);opacity:.75}
.lock{border:2px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;
  font:inherit;font-size:12px;font-weight:700;padding:3px 10px;cursor:pointer;white-space:nowrap}
.lock[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.lock:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--cap4);outline-offset:2px}

/* sub-capsule tray under 攻略対象 */
.subtray{margin:-2px 0 4px 44px;background:var(--sub-bg);border-radius:12px;padding:10px 10px 8px;display:grid;gap:6px}
.subtray .hint{font-size:11px;color:var(--muted);line-height:1.4}
.subs{display:flex;flex-wrap:wrap;gap:6px}
.sub{min-width:46px;height:40px;padding:0 10px;border-radius:9px;border:2px solid var(--line);background:var(--panel);
  color:var(--ink);font:inherit;font-weight:700;font-size:14px;cursor:pointer;position:relative;transition:background .1s,border-color .1s}
.sub.on{background:var(--cap1);border-color:var(--ink);color:#3a2a00}
.sub.pinned{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.sub.pinned::after{content:"固定";position:absolute;top:-9px;right:-6px;font-size:9px;line-height:1;background:var(--ink);color:var(--panel);padding:2px 4px;border-radius:4px}

/* neta frequency switch */
.netabar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#fff;font-weight:700;font-size:13px}
.seg{display:flex;background:var(--machine-dark);border-radius:999px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;color:#ffe3dc;font:inherit;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink)}

.lever{display:flex;gap:10px;align-items:stretch}
.spinbtn{flex:1;border:none;cursor:pointer;background:var(--cap1);color:#3a2a00;font-family:var(--f-display);
  font-size:22px;padding:14px 10px;border-radius:999px;box-shadow:0 5px 0 #c99a10;transition:transform .08s,box-shadow .08s}
.spinbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #c99a10}
.spinbtn .knob{display:inline-block;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.spinbtn.turn .knob{transform:rotate(360deg)}
.copy{border:none;cursor:pointer;background:var(--panel);color:var(--ink);font:inherit;font-weight:700;
  padding:0 16px;border-radius:999px;box-shadow:0 5px 0 var(--machine-dark)}
.copy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--machine-dark)}

.result{background:var(--panel);border-radius:16px;padding:16px 18px;text-align:center;border:2.5px solid var(--ink)}
.result .lbl{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.result .txt{font-family:var(--f-display);font-size:clamp(17px,4.8vw,21px);line-height:1.6;text-wrap:balance;margin-top:2px}

section h2{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0 0 8px;color:var(--page-ink)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hist li{background:var(--panel);border-radius:12px;padding:8px 12px;font-size:14px;display:flex;gap:8px;align-items:baseline}
.hist li b{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.hist .empty{color:var(--page-muted);background:transparent;padding:0}
.hist-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.hist-head h2{margin:0}
.hist-head .count{font-family:var(--f-body);font-size:13px;color:var(--page-muted);font-weight:700}
.hist-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--page-ink);font-size:13px;font-weight:700}
.confirm{display:inline-flex;align-items:center;gap:6px}
.hreset{border:2px solid var(--page-muted);background:transparent;color:var(--page-ink);font:inherit;font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;cursor:pointer}
.hreset.danger{background:var(--machine);border-color:var(--machine);color:#fff}
.hist li span{flex:1;min-width:0}
.hcopy{border:none;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0 2px;flex:none}
.hcopy:hover{color:var(--ink)}

details{background:var(--panel);border-radius:16px;padding:12px 16px}
summary{cursor:pointer;font-weight:700}
.editor{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.editor label{display:grid;gap:4px;font-size:13px;font-weight:700;min-width:0;align-content:start}
.editor label.wide{grid-column:1/-1}
.editor .note{font-weight:500;color:var(--muted);font-size:12px}
.editor textarea{width:100%;min-height:180px;resize:vertical;border:2px solid var(--line);border-radius:10px;
  background:var(--sub-bg);color:var(--ink);font:inherit;font-size:14px;padding:8px;line-height:1.6}
.editor-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.small{border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:700;
  padding:4px 12px;border-radius:999px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--panel);padding:8px 18px;border-radius:999px;font-weight:700;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:420px){.subtray{margin-left:0}}
@media (prefers-reduced-motion:reduce){.spinbtn .knob{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>お話ガチャ</h1>
    <p>キャラチャットのお話づくりに。レバーを回してお題を引こう</p>
  </header>

  <div class="machine">
    <div class="dome" id="slots"></div>
    <div class="lever">
      <button class="spinbtn" id="spin" type="button"><span class="knob">◎</span> 回す！</button>
      <button class="copy" id="copy" type="button">コピー</button>
    </div>
  </div>

  <div class="result" aria-live="polite">
    <div class="lbl">今日のお題</div>
    <div class="txt" id="sentence"></div>
  </div>

  <section>
    <div class="hist-head">
      <h2>これまでのお題 <span class="count" id="hist-count"></span></h2>
      <div class="hist-actions">
        <button class="hreset" id="hist-reset" type="button">履歴をリセット</button>
        <span class="confirm" id="hist-confirm" hidden>全部消しますか？
          <button class="hreset danger" id="hist-yes" type="button">消す</button>
          <button class="hreset" id="hist-no" type="button">やめる</button>
        </span>
      </div>
    </div>
    <ol class="hist" id="hist"><li class="empty">まだありません。回してみてください。</li></ol>
  </section>

  <details>
    <summary>ことばを編集する</summary>
    <div class="editor" id="editor"></div>
    <div class="editor-foot">
      <span>1行に1つ。このブラウザに保存されます。</span>
      <button class="small" id="reset" type="button">最初のことばに戻す</button>
    </div>
  </details>
</div>
<div class="toast" id="toast"></div>

const SLOTS=[
 {key:"who",label:"攻略対象",part:"が",c:"var(--cap1)"},
 {key:"where",label:"どこで",part:"で",c:"var(--cap2)"},
 {key:"what",label:"なにをして",part:"",c:"var(--cap3)"},
 {key:"how",label:"どうなる",part:"話",c:"var(--cap4)"},
 {key:"genre",label:"はなし",part:"",c:"var(--cap5)"}
];
const lines=t=>t.split("\n").map(x=>x.trim().replace(/^[＊*]\s*/,"")).filter(Boolean);
const isNeta=w=>w.startsWith("*");
const clean=w=>String(w).replace(/^\*/,"");
function textToCats(t){
  return lines(t).map(l=>{
    const m=l.split(/[：:]/);const name=m[0].trim();
    const subs=(m.slice(1).join(":")||"").split(/[、,，]/).map(x=>x.trim()).filter(Boolean);
    return {name,subs};
  }).filter(c=>clean(c.name));
}
const catsToText=()=>CATS.map(c=>`${c.name}：${c.subs.join("、")}`).join("\n");

let CATS=textToCats(DEFAULT_CATS_TEXT);
SLOTS.forEach((s,i)=>{if(i>0)s.words=lines(DEFAULT_WORDS[i])});

const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY="odai-words-v5";
const saved=store.get(KEY);
if(saved){
  if(Array.isArray(saved.cats)&&saved.cats.length)CATS=saved.cats;
  if(Array.isArray(saved.words))saved.words.forEach((w,i)=>{if(i>0&&SLOTS[i]&&Array.isArray(w)&&w.length)SLOTS[i].words=w});
}
const save=()=>store.set(KEY,{cats:CATS,words:SLOTS.map(s=>s.words||null)});

const state=SLOTS.map(()=>({val:"",locked:false}));
state[0].sub=null; state[0].pinned=false;
let history=store.get("odai-hist")||[];

const rand=a=>a[Math.floor(Math.random()*a.length)];
const pickAny=(arr,not)=>{if(!arr.length)return "？";if(arr.length<2)return arr[0];let v;do{v=rand(arr)}while(v===not);return v};
const pickWeighted=pickAny;
const words=i=>i===0?CATS.map(c=>c.name):SLOTS[i].words;
const curCat=()=>CATS.find(c=>c.name===state[0].val)||{name:state[0].val,subs:[]};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const slotsEl=document.getElementById("slots");
SLOTS.forEach((s,i)=>{
  const row=document.createElement("div");row.className="slot";row.style.setProperty("--c",s.c);
  row.innerHTML=`<span class="ball" aria-hidden="true"></span><div class="box"><small>${s.label}</small><div class="val"></div></div><button class="lock" type="button" aria-pressed="false" id="lock-${s.key}">固定</button>`;
  row.querySelector(".lock").onclick=()=>toggleLock(i);
  slotsEl.appendChild(row);s.row=row;
  if(i===0){
    const tray=document.createElement("div");tray.className="subtray";tray.hidden=true;
    tray.innerHTML=`<div class="subs" role="group" aria-label="細分化"></div><div class="hint">回すとこの中から1つ選ばれます。タップで固定、もう一度タップで解除。</div>`;
    slotsEl.appendChild(tray);s.tray=tray;
  }
});

function toggleLock(i){
  const st=state[i];st.locked=!st.locked;
  const b=SLOTS[i].row.querySelector(".lock");b.setAttribute("aria-pressed",st.locked);b.textContent=st.locked?"固定中":"固定";
  if(i===0){
    if(st.locked){st.sub=pickAny(curCat().subs);st.pinned=false}else{st.sub=null;st.pinned=false}
    renderTray();paint(0);showSentence();
  }
}
function renderTray(){
  const s=SLOTS[0],st=state[0];
  s.tray.hidden=!st.locked;
  if(!st.locked)return;
  const box=s.tray.querySelector(".subs");
  box.innerHTML=curCat().subs.map((x,n)=>`<button type="button" class="sub" id="sub-${n}" data-v="${esc(x)}">${esc(x)}</button>`).join("");
  box.querySelectorAll(".sub").forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if(st.pinned&&st.sub===v){st.pinned=false}else{st.sub=v;st.pinned=true}
    markSubs();paint(0);showSentence();
  });
  markSubs();
}
function markSubs(){
  SLOTS[0].tray.querySelectorAll(".sub").forEach(b=>{
    const on=b.dataset.v===state[0].sub;
    b.classList.toggle("on",on);b.classList.toggle("pinned",on&&state[0].pinned);
    b.setAttribute("aria-pressed",on&&state[0].pinned);
  });
}
const whoText=()=>clean(state[0].val)+(state[0].sub?`（${state[0].sub}）`:"");
function paint(i){
  const s=SLOTS[i],st=state[i];
  const sub=i===0&&st.sub?`<span class="s">（${esc(st.sub)}）</span>`:"";
  s.row.querySelector(".val").innerHTML=`${esc(clean(st.val))}${sub}<span class="p">${s.part}</span>`;
}
const sentence=()=>`【${clean(state[4].val)}】${whoText()}が${clean(state[1].val)}で${clean(state[2].val)}${clean(state[3].val)}話。`;
const showSentence=()=>document.getElementById("sentence").textContent=sentence();
function renderHist(){
  const el=document.getElementById("hist");
  document.getElementById("hist-count").textContent=history.length?`${history.length}件`:"";
  document.getElementById("hist-reset").disabled=!history.length;
  if(!history.length){el.innerHTML='<li class="empty">まだありません。回してみてください。</li>';return}
  el.innerHTML=history.map((h,n)=>`<li><b>${String(history.length-n).padStart(2,"0")}</b><span>${esc(h)}</span><button class="hcopy" type="button" data-i="${n}">コピー</button></li>`).join("");
  el.querySelectorAll(".hcopy").forEach(b=>b.onclick=()=>copyText(history[+b.dataset.i]));
}

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let spinning=false;
function roll(ticks,delay,onTick,onEnd){return new Promise(res=>{let t=0;const step=()=>{if(t>=ticks){onEnd();res();return}onTick();t++;setTimeout(step,delay+t*6)};step()})}
function spin(){
  if(spinning)return;spinning=true;
  const btn=document.getElementById("spin");btn.classList.remove("turn");void btn.offsetWidth;btn.classList.add("turn");
  const jobs=state.map((st,i)=>{
    if(st.locked){
      if(i===0&&!st.pinned){
        const subs=curCat().subs,target=pickAny(subs,st.sub);
        return roll(reduce?0:12,45,()=>{st.sub=pickAny(subs,st.sub);markSubs();paint(0)},()=>{st.sub=target;markSubs();paint(0)});
      }
      return Promise.resolve();
    }
    const row=SLOTS[i].row,list=words(i),target=pickWeighted(list,st.val);row.classList.add("spin");
    return roll(reduce?0:8+i*4,45,()=>{st.val=pickAny(list,st.val);paint(i)},()=>{st.val=target;paint(i);row.classList.remove("spin")});
  });
  Promise.all(jobs).then(()=>{showSentence();history.unshift(sentence());history=history.slice(0,50);store.set("odai-hist",history);renderHist();spinning=false});
}
document.getElementById("spin").onclick=spin;


const toastEl=document.getElementById("toast");let tt;
function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),1500)}
function copyText(t){
  navigator.clipboard.writeText(t).then(()=>toast("コピーしました"),()=>{
    const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?"コピーしました":"コピーできませんでした。長押しで選んでください")});
}
document.getElementById("copy").onclick=()=>copyText(sentence());
const hc=document.getElementById("hist-confirm"),hr=document.getElementById("hist-reset");
hr.onclick=()=>{hr.hidden=true;hc.hidden=false};
document.getElementById("hist-no").onclick=()=>{hc.hidden=true;hr.hidden=false};
document.getElementById("hist-yes").onclick=()=>{history=[];store.set("odai-hist",history);renderHist();hc.hidden=true;hr.hidden=false;toast("履歴をリセットしました")};

const ed=document.getElementById("editor");
const countText=(label,arr,unit)=>`${label}（${arr.length}${unit}）`;
function buildEditor(){
  ed.innerHTML="";
  const l0=document.createElement("label");l0.className="wide";
  l0.innerHTML=`<span></span><span class="note">「種類：細分化、細分化…」の形で1行に1つ。例）獣人：狼、猫、狐</span><textarea id="words-who"></textarea>`;
  l0.firstChild.textContent=countText("攻略対象",CATS,"種類");
  const t0=l0.querySelector("textarea");t0.value=catsToText();
  t0.oninput=()=>{const c=textToCats(t0.value);if(c.length){CATS=c;l0.firstChild.textContent=countText("攻略対象",c,"種類");save();if(state[0].locked)renderTray()}};
  ed.appendChild(l0);
  SLOTS.forEach((s,i)=>{
    if(i===0)return;
    const l=document.createElement("label");l.innerHTML=`<span></span><textarea id="words-${s.key}"></textarea>`;
    l.firstChild.textContent=countText(s.label,s.words,"個");
    const ta=l.querySelector("textarea");ta.value=s.words.join("\n");
    ta.oninput=()=>{const w=lines(ta.value);if(w.length){s.words=w;l.firstChild.textContent=countText(s.label,w,"個");save()}};
    ed.appendChild(l);
  });
}
document.getElementById("reset").onclick=()=>{
  CATS=textToCats(DEFAULT_CATS_TEXT);SLOTS.forEach((s,i)=>{if(i>0)s.words=lines(DEFAULT_WORDS[i])});
  try{localStorage.removeItem(KEY)}catch(e){}
  buildEditor();if(state[0].locked)renderTray();toast("最初のことばに戻しました");
};

// 初期状態：すぐにお題が見えるように1回分を引いておく
state.forEach((st,i)=>{st.val=pickWeighted(words(i));paint(i)});
showSentence();renderHist();buildEditor();
</script>
